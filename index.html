<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Бункер — Карточка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
            letter-spacing: 3px;
        }

        .header .subtitle {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            margin: 0 auto;
        }

        .player-name {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(233, 69, 96, 0.3);
        }

        .stat-row {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }

        .stat-row:hover {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            padding-left: 10px;
            padding-right: 10px;
            margin: 0 -10px;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-icon {
            font-size: 24px;
            margin-right: 15px;
            width: 30px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 120px;
        }

        .stat-value {
            flex: 1;
            font-size: 15px;
            color: #fff;
            text-align: right;
            line-height: 1.4;
        }

        .stat-value.hidden {
            color: #555;
            font-style: italic;
            filter: blur(4px);
            user-select: none;
        }

        .stat-value.hidden::after {
            content: " 🔒";
            filter: blur(0);
        }

        .revealed .stat-value {
            color: #4ecca3;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            margin-left: 8px;
            font-weight: bold;
        }

        .badge-revealed {
            background: rgba(78, 204, 163, 0.2);
            color: #4ecca3;
        }

        .badge-hidden {
            background: rgba(136, 136, 136, 0.2);
            color: #888;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #555;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #e94560;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            animation: fadeIn 0.5s ease-out;
        }

        .stat-row {
            animation: fadeIn 0.5s ease-out backwards;
        }

        .stat-row:nth-child(1) { animation-delay: 0.05s; }
        .stat-row:nth-child(2) { animation-delay: 0.1s; }
        .stat-row:nth-child(3) { animation-delay: 0.15s; }
        .stat-row:nth-child(4) { animation-delay: 0.2s; }
        .stat-row:nth-child(5) { animation-delay: 0.25s; }
        .stat-row:nth-child(6) { animation-delay: 0.3s; }
        .stat-row:nth-child(7) { animation-delay: 0.35s; }
        .stat-row:nth-child(8) { animation-delay: 0.4s; }
        .stat-row:nth-child(9) { animation-delay: 0.45s; }
        .stat-row:nth-child(10) { animation-delay: 0.5s; }
        .stat-row:nth-child(11) { animation-delay: 0.55s; }
        .stat-row:nth-child(12) { animation-delay: 0.6s; }
    </style>
<base target="_blank">
</head>
<body>
    <div class="header">
        <h1>☢️ БУНКЕР</h1>
        <div class="subtitle">Карточка персонажа</div>
    </div>

    <div id="content">
        <div class="error">Загрузка...</div>
    </div>

    <div class="footer">Бункер Telegram Bot</div>

    <script>
        const LABELS = {
            profession: "👨‍💼 Профессия",
            health: "❤️ Здоровье",
            baggage: "🎒 Багаж",
            extra_info: "📌 Доп. информация",
            character: "🧠 Характер",
            nationality: "🌍 Национальность",
            hobby: "🎯 Хобби",
            orientation: "🏳️ Ориентация",
            ideology: "📖 Идеология",
            favorite: "⭐ Избранное",
            phobia: "😨 Фобия",
            knowledge: "📚 Знания"
        };

        const ICONS = {
            profession: "💼",
            health: "❤️",
            baggage: "🎒",
            extra_info: "📌",
            character: "🧠",
            nationality: "🌍",
            hobby: "🎯",
            orientation: "🏳️",
            ideology: "📖",
            favorite: "⭐",
            phobia: "😨",
            knowledge: "📚"
        };

        function renderCard(data) {
            const content = document.getElementById('content');

            let html = `<div class="card"><div class="player-name">${data.name || 'Неизвестный'}</div>`;

            const keys = Object.keys(data.chars || {});
            keys.forEach((key, index) => {
                const item = data.chars[key];
                const isRevealed = item.revealed;
                const label = LABELS[key] || key;
                const icon = ICONS[key] || "•";
                const value = isRevealed ? item.value : "Скрыто";
                const valueClass = isRevealed ? "" : "hidden";
                const rowClass = isRevealed ? "revealed" : "";
                const badge = isRevealed ? '<span class="badge badge-revealed">🔓</span>' : '<span class="badge badge-hidden">🔒</span>';

                html += `
                    <div class="stat-row ${rowClass}">
                        <div class="stat-icon">${icon}</div>
                        <div class="stat-label">${label}</div>
                        <div class="stat-value ${valueClass}">${value} ${badge}</div>
                    </div>
                `;
            });

            html += '</div>';
            content.innerHTML = html;
        }

        function showError(msg) {
            document.getElementById('content').innerHTML = `<div class="error">${msg}</div>`;
        }

        // Парсим данные из URL
        try {
            const params = new URLSearchParams(window.location.search);
            const b64 = params.get('d');

            if (!b64) {
                showError('❌ Нет данных карточки. Откройте через бота.');
            } else {
                const json = atob(b64);
                const data = JSON.parse(json);
                renderCard(data);
            }
        } catch (e) {
            showError('❌ Ошибка загрузки карточки: ' + e.message);
        }

        // Telegram WebApp API
        if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
