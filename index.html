<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Бункер — Карточки игроков</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --accent: #e94560;
            --accent-glow: rgba(233, 69, 96, 0.5);
            --success: #4ecca3;
            --border: rgba(233, 69, 96, 0.3);
            --lock-color: #e94560;
            --unlock-color: #4ecca3;
        }

        [data-theme="light"] {
            --bg-primary: #f0f0f5;
            --bg-secondary: #e0e0e8;
            --bg-card: rgba(255, 255, 255, 0.8);
            --text-primary: #1a1a2e;
            --text-secondary: #555;
            --accent: #d6336c;
            --accent-glow: rgba(214, 51, 108, 0.3);
            --success: #2b8a3e;
            --border: rgba(214, 51, 108, 0.3);
            --lock-color: #d6336c;
            --unlock-color: #2b8a3e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        [data-theme="light"] .header {
            background: rgba(255,255,255,0.5);
        }

        .header h1 {
            font-size: 20px;
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
            letter-spacing: 3px;
        }

        .header .subtitle {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .theme-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Refresh Button */
        .refresh-btn {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(78, 204, 163, 0.15);
            border: 1px solid rgba(78, 204, 163, 0.3);
            color: var(--success);
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: rgba(78, 204, 163, 0.3);
        }

        .refresh-btn.spinning .refresh-icon {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Progress Bar */
        .progress-container {
            padding: 10px 20px;
            background: rgba(0,0,0,0.15);
        }

        [data-theme="light"] .progress-container {
            background: rgba(255,255,255,0.3);
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--success));
            border-radius: 3px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Carousel */
        .carousel-container {
            position: relative;
            height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            width: 100%;
        }

        .card-wrapper {
            min-width: 100%;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            max-height: calc(100vh - 220px);
            overflow-y: auto;
        }

        .card::-webkit-scrollbar { width: 4px; }
        .card::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

        /* Player Badge */
        .player-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .badge-me {
            background: rgba(233, 69, 96, 0.2);
            color: var(--accent);
            border: 1px solid var(--border);
        }

        .badge-other {
            background: rgba(78, 204, 163, 0.15);
            color: var(--success);
            border: 1px solid rgba(78, 204, 163, 0.3);
        }

        .player-name {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
        }

        /* Stats with Flip Animation */
        .stat-row {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
            perspective: 1000px;
        }

        .stat-row:hover {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding-left: 10px;
            padding-right: 10px;
            margin: 0 -10px;
        }

        .stat-row:last-child { border-bottom: none; }

        .stat-icon {
            font-size: 20px;
            margin-right: 10px;
            width: 26px;
            text-align: center;
            flex-shrink: 0;
        }

        .stat-content {
            flex: 1;
            min-width: 0;
        }

        .stat-label {
            font-size: 9px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        /* Flip Card Container */
        .flip-container {
            position: relative;
            min-height: 24px;
        }

        .flip-card {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flip-card.flipped {
            transform: rotateY(180deg);
        }

        .flip-front, .flip-back {
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .flip-back {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotateY(180deg);
        }

        .stat-value {
            font-size: 13px;
            color: var(--text-primary);
            line-height: 1.4;
            word-break: break-word;
        }

        .stat-value.hidden {
            color: var(--text-secondary);
            font-style: italic;
        }

        .stat-value.revealed {
            color: var(--success);
        }

        .lock-icon { font-size: 14px; }
        .lock-locked { color: var(--lock-color); }
        .lock-unlocked { color: var(--unlock-color); }

        /* Navigation */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid var(--border);
            color: var(--accent);
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .nav-btn:hover {
            background: rgba(233, 69, 96, 0.3);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .nav-prev { left: 8px; }
        .nav-next { right: 8px; }

        .pagination {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.3s;
            cursor: pointer;
        }

        .dot.active {
            background: var(--accent);
            transform: scale(1.3);
        }

        /* ===== ЧАТ ===== */

        /* Кнопка открытия чата */
        .chat-fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 200;
            box-shadow: 0 4px 16px rgba(233, 69, 96, 0.4);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-fab:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 24px rgba(233, 69, 96, 0.6);
        }

        .chat-fab:active {
            transform: scale(0.95);
        }

        .chat-fab .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ff4757;
            color: white;
            font-size: 11px;
            font-weight: bold;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        /* Оверлей чата */
        .chat-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 300;
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .chat-overlay.active {
            display: flex;
            opacity: 1;
        }

        /* Шапка чата */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }

        .chat-header-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header-status {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .chat-close {
            background: none;
            border: 1px solid var(--border);
            color: var(--accent);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .chat-close:hover {
            background: rgba(233, 69, 96, 0.2);
        }

        /* Сообщения */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
            animation: messageIn 0.3s ease-out;
        }

        .chat-message.me {
            background: var(--accent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-message.other {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .chat-message.system {
            background: rgba(78, 204, 163, 0.15);
            border: 1px solid rgba(78, 204, 163, 0.3);
            color: var(--success);
            align-self: center;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 12px;
        }

        .chat-author {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 3px;
            opacity: 0.8;
        }

        .chat-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }

        /* Поле ввода */
        .chat-input-area {
            padding: 12px 16px 24px 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            font-family: inherit;
            line-height: 1.4;
        }

        .chat-input::placeholder {
            color: var(--text-secondary);
        }

        .chat-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(233, 69, 96, 0.2);
        }

        .chat-send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .chat-send-btn:hover {
            background: #ff6b81;
            transform: scale(1.05);
        }

        .chat-send-btn:active {
            transform: scale(0.95);
        }

        /* Пустое состояние */
        .chat-empty {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px 20px;
            font-size: 14px;
        }

        .chat-empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 6px;
            font-size: 9px;
            color: var(--text-secondary);
            background: rgba(0,0,0,0.3);
            z-index: 5;
        }

        [data-theme="light"] .footer {
            background: rgba(255,255,255,0.5);
        }

        .error {
            text-align: center;
            padding: 30px;
            color: var(--accent);
            font-size: 14px;
        }

        .error-box {
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            margin: 20px auto;
        }

        .error-box .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .error-box h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .error-box p {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.5;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes revealFlash {
            0% { background: transparent; }
            50% { background: rgba(78, 204, 163, 0.3); }
            100% { background: transparent; }
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-wrapper {
            animation: fadeIn 0.4s ease-out;
        }

        .stat-row.reveal-animation {
            animation: revealFlash 0.8s ease-out;
        }

        .updating {
            animation: pulse 1.5s infinite;
        }

        .swipe-hint {
            text-align: center;
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        @media (max-width: 480px) {
            .card { padding: 15px; }
            .player-name { font-size: 17px; }
            .nav-btn { width: 35px; height: 35px; font-size: 20px; }
            .chat-fab { width: 50px; height: 50px; font-size: 20px; bottom: 16px; right: 16px; }
            .chat-message { max-width: 90%; font-size: 13px; }
            .chat-input { font-size: 16px; }
            .refresh-btn { font-size: 11px; padding: 3px 8px; }
        }
    </style>

<body>
    <div class="header">
        <button class="refresh-btn" id="refreshBtn">
            <span class="refresh-icon">🔄</span>
            <span>Обновить</span>
        </button>
        <h1>☢️ БУНКЕР</h1>
        <div class="subtitle">Карточки игроков</div>
        <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>

    <div class="progress-container" id="progressContainer">
        <div class="progress-label">
            <span>Раскрыто характеристик</span>
            <span id="progressText">0/0</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
    </div>

    <div class="carousel-container">
        <button class="nav-btn nav-prev" id="prevBtn">‹</button>
        <div class="carousel-track" id="track"></div>
        <button class="nav-btn nav-next" id="nextBtn">›</button>
        <div class="pagination" id="pagination"></div>
    </div>

    <!-- Кнопка чата -->
    <button class="chat-fab" id="chatFab">
        💬
        <span class="badge" id="chatBadge" style="display:none">0</span>
    </button>

    <!-- Оверлей чата -->
    <div class="chat-overlay" id="chatOverlay">
        <div class="chat-header">
            <div>
                <div class="chat-header-title">💬 Чат бункера</div>
                <div class="chat-header-status" id="chatStatus">💡 Локальный режим — сообщения видны только тебе</div>
            </div>
            <button class="chat-close" id="chatClose">✕</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-empty">
                <div class="chat-empty-icon">💬</div>
                <div>Нет сообщений</div>
                <div style="font-size:12px; margin-top:8px; opacity:0.7;">Напиши первое сообщение!</div>
            </div>
        </div>
        <div class="chat-input-area">
            <textarea class="chat-input" id="chatInput" placeholder="Написать сообщение..." rows="1"></textarea>
            <button class="chat-send-btn" id="chatSend">➤</button>
        </div>
    </div>

    <div class="footer">
        <span id="updateStatus">🔄 Автообновление: вкл</span> • Свайпай или жми стрелки
    </div>

    <script>
        const LABELS = {
            profession: "Профессия",
            health: "Здоровье",
            baggage: "Багаж",
            extra_info: "Доп. информация",
            character: "Характер",
            nationality: "Национальность",
            hobby: "Хобби",
            orientation: "Ориентация",
            ideology: "Идеология",
            favorite: "Избранное",
            phobia: "Фобия",
            knowledge: "Знания"
        };

        const ICONS = {
            profession: "💼",
            health: "❤️",
            baggage: "🎒",
            extra_info: "📌",
            character: "🧠",
            nationality: "🌍",
            hobby: "🎯",
            orientation: "🏳️",
            ideology: "📖",
            favorite: "⭐",
            phobia: "😨",
            knowledge: "📚"
        };

        let currentIndex = 0;
        let players = [];
        let myId = null;
        let lastDataHash = "";
        let autoUpdateInterval = null;
        let revealedStates = new Set();
        let unreadCount = 0;
        let isChatOpen = false;
        let chatMessages = [];

        // Theme
        function initTheme() {
            const tg = window.Telegram?.WebApp;
            if (tg) {
                const isDark = tg.colorScheme === 'dark';
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
                document.getElementById('themeToggle').textContent = isDark ? '🌙' : '☀️';
            }
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            document.getElementById('themeToggle').textContent = next === 'dark' ? '🌙' : '☀️';
        });

        // Base64 decode
        function decodeBase64(str) {
            try {
                str = str.replace(/-/g, '+').replace(/_/g, '/');
                while (str.length % 4) str += '=';
                const binary = atob(str);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                return new TextDecoder('utf-8').decode(bytes);
            } catch (e) {
                console.error("Decode error:", e);
                return null;
            }
        }

        // Hash for comparison
        function hashData(data) {
            return JSON.stringify(data).split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0);
        }

        // Progress Bar
        function updateProgress() {
            if (!players.length) return;
            let total = 0, revealed = 0;
            players.forEach(p => {
                Object.values(p.chars || {}).forEach(c => {
                    total++;
                    if (c.revealed) revealed++;
                });
            });
            const pct = total ? (revealed / total * 100) : 0;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressText').textContent = `${revealed}/${total}`;
        }

        // Render stat with flip animation
        function renderStat(key, item, isMe, playerId) {
            const isRevealed = item.revealed;
            const label = LABELS[key] || key;
            const icon = ICONS[key] || "•";
            const value = item.value || "";
            const stateKey = `${playerId}_${key}`;
            const wasRevealed = revealedStates.has(stateKey);
            const isNewReveal = isRevealed && !wasRevealed;

            if (isRevealed) revealedStates.add(stateKey);

            const animClass = isNewReveal ? 'reveal-animation' : '';

            let innerHtml;
            if (isRevealed) {
                innerHtml = `
                    <div class="flip-container">
                        <div class="flip-card ${isNewReveal ? 'flipped' : ''}">
                            <div class="flip-front">
                                <span class="lock-icon lock-unlocked">🔓</span>
                                <span class="stat-value revealed">${value}</span>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                if (isMe) {
                    innerHtml = `
                        <div class="flip-container">
                            <div class="flip-card">
                                <div class="flip-front">
                                    <span class="lock-icon lock-locked">🔒</span>
                                    <span class="stat-value hidden">${value}</span>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    innerHtml = `
                        <div class="flip-container">
                            <div class="flip-card">
                                <div class="flip-front">
                                    <span class="lock-icon lock-locked">🔒</span>
                                    <span class="stat-value hidden">Скрыто</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }

            return `
                <div class="stat-row ${animClass}" data-key="${stateKey}">
                    <div class="stat-icon">${icon}</div>
                    <div class="stat-content">
                        <div class="stat-label">${label}</div>
                        ${innerHtml}
                    </div>
                </div>
            `;
        }

        function renderCard(player) {
            const isMe = player.id === myId;
            const badgeClass = isMe ? 'badge-me' : 'badge-other';
            const badgeText = isMe ? '👤 ТВОЯ КАРТОЧКА' : '👥 ИГРОК';

            let statsHtml = '';
            const keys = Object.keys(player.chars || {});
            keys.forEach(key => {
                statsHtml += renderStat(key, player.chars[key], isMe, player.id);
            });

            return `
                <div class="card-wrapper">
                    <div class="card">
                        <div style="text-align: center;">
                            <span class="player-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="player-name">${player.name || 'Неизвестный'}</div>
                        ${statsHtml}
                        ${isMe ? '<div class="swipe-hint">👆 Свайпай для просмотра других игроков</div>' : ''}
                    </div>
                </div>
            `;
        }

        function updateCarousel() {
            const track = document.getElementById('track');
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === players.length - 1;
            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }

        function initCarousel() {
            if (!players.length) {
                document.getElementById('track').innerHTML = `
                    <div class="card-wrapper">
                        <div class="error-box">
                            <div class="icon">📭</div>
                            <h3>Нет данных</h3>
                            <p>Карточки игроков не загружены. Нажми кнопку «🌐 Карточки игроков» в боте или «🔄 Обновить» сверху.</p>
                        </div>
                    </div>
                `;
                return;
            }

            const myIndex = players.findIndex(p => p.id === myId);
            if (myIndex > 0) {
                const [me] = players.splice(myIndex, 1);
                players.unshift(me);
            }

            const track = document.getElementById('track');
            track.innerHTML = players.map(p => renderCard(p)).join('');

            const pagination = document.getElementById('pagination');
            pagination.innerHTML = players.map((_, i) => 
                `<div class="dot ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`
            ).join('');

            document.querySelectorAll('.dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    currentIndex = parseInt(dot.dataset.index);
                    updateCarousel();
                });
            });

            updateProgress();
            updateCarousel();
        }

        // Navigation
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentIndex > 0) { currentIndex--; updateCarousel(); }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentIndex < players.length - 1) { currentIndex++; updateCarousel(); }
        });

        // Swipes
        let touchStartX = 0;
        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            const diff = touchStartX - e.changedTouches[0].screenX;
            if (Math.abs(diff) > 50) {
                if (diff > 0 && currentIndex < players.length - 1) { currentIndex++; updateCarousel(); }
                else if (diff < 0 && currentIndex > 0) { currentIndex--; updateCarousel(); }
            }
        }, { passive: true });

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && currentIndex > 0) { currentIndex--; updateCarousel(); }
            if (e.key === 'ArrowRight' && currentIndex < players.length - 1) { currentIndex++; updateCarousel(); }
        });

        // ===== ОБНОВЛЕНИЕ =====
        const refreshBtn = document.getElementById('refreshBtn');

        refreshBtn.addEventListener('click', () => {
            refreshBtn.classList.add('spinning');

            // Пробуем перезагрузить данные из URL
            loadData();

            // Если Telegram WebApp доступен, пробуем получить свежие данные через initData
            if (window.Telegram?.WebApp) {
                try {
                    const tg = Telegram.WebApp;
                    // Показываем пользователю, что обновление запрошено
                    tg.showPopup({
                        title: '🔄 Обновление',
                        message: 'Данные обновлены! Если карточки не изменились, нажми «🌐 Карточки игроков» в боте для получения актуальных данных.',
                        buttons: [{type: 'ok'}]
                    });
                } catch (e) {
                    console.log('Telegram popup error:', e);
                }
            }

            setTimeout(() => {
                refreshBtn.classList.remove('spinning');
            }, 1000);
        });

        // ===== ЧАТ =====
        const chatFab = document.getElementById('chatFab');
        const chatOverlay = document.getElementById('chatOverlay');
        const chatClose = document.getElementById('chatClose');
        const chatInput = document.getElementById('chatInput');
        const chatSend = document.getElementById('chatSend');
        const chatMessagesEl = document.getElementById('chatMessages');
        const chatBadge = document.getElementById('chatBadge');

        function openChat() {
            isChatOpen = true;
            unreadCount = 0;
            chatBadge.style.display = 'none';
            chatOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            setTimeout(() => chatInput.focus(), 300);
            scrollToBottom();
        }

        function closeChat() {
            isChatOpen = false;
            chatOverlay.classList.remove('active');
            document.body.style.overflow = '';
            chatInput.blur();
        }

        function scrollToBottom() {
            chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
        }

        function updateBadge() {
            if (!isChatOpen && unreadCount > 0) {
                chatBadge.textContent = unreadCount > 99 ? '99+' : unreadCount;
                chatBadge.style.display = 'flex';
            }
        }

        function formatTime(date) {
            return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        function addMessage(text, author, type = 'other') {
            const msg = {
                text,
                author,
                type,
                time: new Date()
            };
            chatMessages.push(msg);

            // Убираем пустое состояние
            if (chatMessages.length === 1) {
                chatMessagesEl.innerHTML = '';
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${type}`;

            if (type === 'system') {
                msgDiv.innerHTML = `<div>${text}</div>`;
            } else {
                msgDiv.innerHTML = `
                    <div class="chat-author">${author}</div>
                    <div>${text}</div>
                    <div class="chat-time">${formatTime(msg.time)}</div>
                `;
            }

            chatMessagesEl.appendChild(msgDiv);
            scrollToBottom();

            if (!isChatOpen) {
                unreadCount++;
                updateBadge();
            }
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            const me = players.find(p => p.id === myId);
            const author = me ? me.name : `Игрок ${myId}`;

            addMessage(text, author, 'me');
            chatInput.value = '';
            chatInput.style.height = 'auto';
        }

        // Auto-resize textarea
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        chatFab.addEventListener('click', openChat);
        chatClose.addEventListener('click', closeChat);
        chatSend.addEventListener('click', sendMessage);

        // Закрытие по клику на оверлей (вне чата)
        chatOverlay.addEventListener('click', (e) => {
            if (e.target === chatOverlay) closeChat();
        });

        // Escape для закрытия
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isChatOpen) closeChat();
        });

        // Закрытие свайпом вниз (для мобильных)
        let touchStartY = 0;
        chatOverlay.addEventListener('touchstart', (e) => {
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        chatOverlay.addEventListener('touchend', (e) => {
            const diff = touchStartY - e.changedTouches[0].screenY;
            if (diff < -100 && isChatOpen) closeChat();
        }, { passive: true });

        // Auto-update via polling
        function startAutoUpdate() {
            autoUpdateInterval = setInterval(() => {
                checkForUpdates();
            }, 5000);
        }

        function checkForUpdates() {
            updateProgress();
        }

        // Load data
        function loadData() {
            try {
                const params = new URLSearchParams(window.location.search);
                const b64 = params.get('d');

                if (!b64) {
                    document.getElementById('track').innerHTML = `
                        <div class="card-wrapper">
                            <div class="error-box">
                                <div class="icon">🔗</div>
                                <h3>Нет данных в URL</h3>
                                <p>Откройте карточки через кнопку «🌐 Карточки игроков» в боте Telegram.</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                const json = decodeBase64(b64);
                if (!json) throw new Error("Ошибка декодирования Base64");

                const data = JSON.parse(json);

                // Проверяем структуру данных
                if (!data.players || !Array.isArray(data.players)) {
                    throw new Error("Неверная структура данных: отсутствует массив players");
                }

                if (data.players.length === 0) {
                    throw new Error("Список игроков пуст");
                }

                const newHash = hashData(data);
                if (newHash !== lastDataHash) {
                    lastDataHash = newHash;
                    players = data.players;
                    myId = data.myId || null;
                    initCarousel();

                    // Показываем уведомление об обновлении
                    if (document.getElementById('track').children.length > 0) {
                        document.getElementById('updateStatus').textContent = '✅ Данные загружены';
                        setTimeout(() => {
                            document.getElementById('updateStatus').textContent = '🔄 Автообновление: вкл';
                        }, 3000);
                    }
                }
            } catch (e) {
                console.error("Load data error:", e);
                document.getElementById('track').innerHTML = `
                    <div class="card-wrapper">
                        <div class="error-box">
                            <div class="icon">⚠️</div>
                            <h3>Ошибка загрузки</h3>
                            <p>${e.message}</p>
                            <p style="margin-top:10px; font-size:12px;">Попробуй нажать «🔄 Обновить» или открыть карточки заново через бота.</p>
                        </div>
                    </div>
                `;
            }
        }

        // Init
        initTheme();
        loadData();
        startAutoUpdate();

        // Добавляем системное сообщение о режиме чата
        addMessage('💡 Чат работает в локальном режиме. Сообщения видны только на этом устройстве. Для общего чата нужен сервер.', 'Система', 'system');

        if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
            Telegram.WebApp.onEvent('themeChanged', initTheme);

            // Пробуем получить данные из initDataUnsafe если есть
            try {
                const initData = Telegram.WebApp.initDataUnsafe;
                if (initData && initData.user) {
                    console.log('Telegram user:', initData.user);
                }
            } catch (e) {
                console.log('initData error:', e);
            }
        }
    </script>
</body>
</html>
