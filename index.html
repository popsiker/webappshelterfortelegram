<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Бункер — Карточки игроков</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e0e0;
            min-height: 100vh;
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(233, 69, 96, 0.3);
        }

        .header h1 {
            font-size: 22px;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
            letter-spacing: 3px;
        }

        .header .subtitle {
            font-size: 11px;
            color: #888;
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .carousel-container {
            position: relative;
            height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            width: 100%;
        }

        .card-wrapper {
            min-width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .card::-webkit-scrollbar { width: 4px; }
        .card::-webkit-scrollbar-thumb { background: rgba(233, 69, 96, 0.5); border-radius: 2px; }

        .player-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .badge-me {
            background: rgba(233, 69, 96, 0.3);
            color: #e94560;
            border: 1px solid rgba(233, 69, 96, 0.5);
        }

        .badge-other {
            background: rgba(78, 204, 163, 0.2);
            color: #4ecca3;
            border: 1px solid rgba(78, 204, 163, 0.4);
        }

        .player-name {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(233, 69, 96, 0.3);
        }

        .stat-row {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }

        .stat-row:hover {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding-left: 10px;
            padding-right: 10px;
            margin: 0 -10px;
        }

        .stat-row:last-child { border-bottom: none; }

        .stat-icon {
            font-size: 22px;
            margin-right: 12px;
            width: 28px;
            text-align: center;
            flex-shrink: 0;
        }

        .stat-content {
            flex: 1;
            min-width: 0;
        }

        .stat-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 3px;
        }

        .stat-value {
            font-size: 14px;
            color: #fff;
            line-height: 1.4;
            word-break: break-word;
        }

        .stat-value.hidden {
            color: #555;
            font-style: italic;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lock-icon {
            font-size: 16px;
            color: #e94560;
            flex-shrink: 0;
        }

        .unlock-icon {
            font-size: 16px;
            color: #4ecca3;
            flex-shrink: 0;
        }

        .stat-value.revealed {
            color: #4ecca3;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid rgba(233, 69, 96, 0.4);
            color: #e94560;
            font-size: 28px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .nav-btn:hover {
            background: rgba(233, 69, 96, 0.4);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-prev { left: 10px; }
        .nav-next { right: 10px; }

        .pagination {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.3s;
            cursor: pointer;
        }

        .dot.active {
            background: #e94560;
            transform: scale(1.3);
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 8px;
            font-size: 10px;
            color: #444;
            background: rgba(0,0,0,0.5);
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #e94560;
            font-size: 16px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-wrapper {
            animation: fadeIn 0.4s ease-out;
        }

        .swipe-hint {
            text-align: center;
            font-size: 11px;
            color: #555;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        @media (max-width: 480px) {
            .card { padding: 18px; }
            .player-name { font-size: 18px; }
            .nav-btn { width: 38px; height: 38px; font-size: 22px; }
            .nav-prev { left: 5px; }
            .nav-next { right: 5px; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="header">
        <h1>☢️ БУНКЕР</h1>
        <div class="subtitle">Карточки игроков</div>
    </div>

    <div class="carousel-container">
        <button class="nav-btn nav-prev" id="prevBtn">‹</button>

        <div class="carousel-track" id="track"></div>

        <button class="nav-btn nav-next" id="nextBtn">›</button>

        <div class="pagination" id="pagination"></div>
    </div>

    <div class="footer">Бункер Telegram Bot • Свайпай или жми стрелки</div>

    <script>
        const LABELS = {
            profession: "Профессия",
            health: "Здоровье",
            baggage: "Багаж",
            extra_info: "Доп. информация",
            character: "Характер",
            nationality: "Национальность",
            hobby: "Хобби",
            orientation: "Ориентация",
            ideology: "Идеология",
            favorite: "Избранное",
            phobia: "Фобия",
            knowledge: "Знания"
        };

        const ICONS = {
            profession: "💼",
            health: "❤️",
            baggage: "🎒",
            extra_info: "📌",
            character: "🧠",
            nationality: "🌍",
            hobby: "🎯",
            orientation: "🏳️",
            ideology: "📖",
            favorite: "⭐",
            phobia: "😨",
            knowledge: "📚"
        };

        let currentIndex = 0;
        let players = [];
        let myId = null;

        function decodeBase64(str) {
            try {
                str = str.replace(/-/g, '+').replace(/_/g, '/');
                while (str.length % 4) str += '=';
                const binary = atob(str);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new TextDecoder('utf-8').decode(bytes);
            } catch (e) {
                console.error("Decode error:", e);
                return null;
            }
        }

        function renderCard(player) {
            const isMe = player.id === myId;
            const badgeClass = isMe ? 'badge-me' : 'badge-other';
            const badgeText = isMe ? '👤 ТВОЯ КАРТОЧКА' : '👥 ИГРОК';

            let statsHtml = '';
            const keys = Object.keys(player.chars || {});

            keys.forEach(key => {
                const item = player.chars[key];
                const isRevealed = item.revealed;
                const label = LABELS[key] || key;
                const icon = ICONS[key] || "•";
                const value = item.value || "";

                let valueHtml;
                if (isRevealed) {
                    valueHtml = `<span class="stat-value revealed"><span class="unlock-icon">🔓</span>${value}</span>`;
                } else {
                    if (isMe) {
                        // Своя скрытая характеристика — показываем значение, но с замком
                        valueHtml = `<span class="stat-value hidden"><span class="lock-icon">🔒</span>${value}</span>`;
                    } else {
                        // Чужая скрытая — просто замок
                        valueHtml = `<span class="stat-value hidden"><span class="lock-icon">🔒</span>Скрыто</span>`;
                    }
                }

                statsHtml += `
                    <div class="stat-row">
                        <div class="stat-icon">${icon}</div>
                        <div class="stat-content">
                            <div class="stat-label">${label}</div>
                            ${valueHtml}
                        </div>
                    </div>
                `;
            });

            return `
                <div class="card-wrapper">
                    <div class="card">
                        <div style="text-align: center;">
                            <span class="player-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="player-name">${player.name || 'Неизвестный'}</div>
                        ${statsHtml}
                        ${isMe ? '<div class="swipe-hint">👆 Свайпай в сторону, чтобы посмотреть других</div>' : ''}
                    </div>
                </div>
            `;
        }

        function updateCarousel() {
            const track = document.getElementById('track');
            track.style.transform = `translateX(-${currentIndex * 100}%)`;

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === players.length - 1;

            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }

        function initCarousel() {
            if (!players.length) {
                document.getElementById('track').innerHTML = '<div class="error">❌ Нет данных игроков</div>';
                return;
            }

            // Находим свою карточку и ставим первой
            const myIndex = players.findIndex(p => p.id === myId);
            if (myIndex > 0) {
                const [me] = players.splice(myIndex, 1);
                players.unshift(me);
            }

            const track = document.getElementById('track');
            track.innerHTML = players.map(p => renderCard(p)).join('');

            const pagination = document.getElementById('pagination');
            pagination.innerHTML = players.map((_, i) => 
                `<div class="dot ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`
            ).join('');

            document.querySelectorAll('.dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    currentIndex = parseInt(dot.dataset.index);
                    updateCarousel();
                });
            });

            updateCarousel();
        }

        // Навигация
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentIndex > 0) { currentIndex--; updateCarousel(); }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentIndex < players.length - 1) { currentIndex++; updateCarousel(); }
        });

        // Свайпы
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0 && currentIndex < players.length - 1) {
                    currentIndex++;
                    updateCarousel();
                } else if (diff < 0 && currentIndex > 0) {
                    currentIndex--;
                    updateCarousel();
                }
            }
        }

        // Клавиатура
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && currentIndex > 0) { currentIndex--; updateCarousel(); }
            if (e.key === 'ArrowRight' && currentIndex < players.length - 1) { currentIndex++; updateCarousel(); }
        });

        // Загрузка данных
        try {
            const params = new URLSearchParams(window.location.search);
            const b64 = params.get('d');

            if (!b64) {
                document.getElementById('track').innerHTML = '<div class="error">❌ Нет данных. Откройте через бота.</div>';
            } else {
                const json = decodeBase64(b64);
                if (!json) throw new Error("Decode failed");
                const data = JSON.parse(json);
                players = data.players || [];
                myId = data.myId || null;
                initCarousel();
            }
        } catch (e) {
            document.getElementById('track').innerHTML = `<div class="error">❌ Ошибка: ${e.message}</div>`;
        }

        if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
