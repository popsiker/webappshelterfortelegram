<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Бункер — Карточки игроков</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --accent: #e94560;
            --accent-glow: rgba(233, 69, 96, 0.5);
            --success: #4ecca3;
            --border: rgba(233, 69, 96, 0.3);
            --lock-color: #e94560;
            --unlock-color: #4ecca3;
        }

        [data-theme="light"] {
            --bg-primary: #f0f0f5;
            --bg-secondary: #e0e0e8;
            --bg-card: rgba(255, 255, 255, 0.8);
            --text-primary: #1a1a2e;
            --text-secondary: #555;
            --accent: #d6336c;
            --accent-glow: rgba(214, 51, 108, 0.3);
            --success: #2b8a3e;
            --border: rgba(214, 51, 108, 0.3);
            --lock-color: #d6336c;
            --unlock-color: #2b8a3e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        [data-theme="light"] .header {
            background: rgba(255,255,255,0.5);
        }

        .header h1 {
            font-size: 20px;
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
            letter-spacing: 3px;
        }

        .header .subtitle {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .theme-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Progress Bar */
        .progress-container {
            padding: 10px 20px;
            background: rgba(0,0,0,0.15);
        }

        [data-theme="light"] .progress-container {
            background: rgba(255,255,255,0.3);
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--success));
            border-radius: 3px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Carousel */
        .carousel-container {
            position: relative;
            height: calc(100vh - 110px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            width: 100%;
        }

        .card-wrapper {
            min-width: 100%;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            max-height: calc(100vh - 130px);
            overflow-y: auto;
        }

        .card::-webkit-scrollbar { width: 4px; }
        .card::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

        /* Player Badge */
        .player-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .badge-me {
            background: rgba(233, 69, 96, 0.2);
            color: var(--accent);
            border: 1px solid var(--border);
        }

        .badge-other {
            background: rgba(78, 204, 163, 0.15);
            color: var(--success);
            border: 1px solid rgba(78, 204, 163, 0.3);
        }

        .player-name {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
        }

        /* Stats with Flip Animation */
        .stat-row {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
            perspective: 1000px;
        }

        .stat-row:hover {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding-left: 10px;
            padding-right: 10px;
            margin: 0 -10px;
        }

        .stat-row:last-child { border-bottom: none; }

        .stat-icon {
            font-size: 20px;
            margin-right: 10px;
            width: 26px;
            text-align: center;
            flex-shrink: 0;
        }

        .stat-content {
            flex: 1;
            min-width: 0;
        }

        .stat-label {
            font-size: 9px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .stat-display {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-value {
            font-size: 13px;
            color: #e0e0e0;
            line-height: 1.4;
            word-break: break-word;
        }

        [data-theme="light"] .stat-value {
            color: #1a1a2e;
        }

        .stat-value.hidden {
            color: #aaaaaa;
            font-style: italic;
        }

        [data-theme="light"] .stat-value.hidden {
            color: #666666;
        }

        .stat-value.revealed {
            color: #4ecca3;
            font-weight: 600;
        }

        [data-theme="light"] .stat-value.revealed {
            color: #1a7a50;
        }

        .lock-icon { font-size: 14px; }
        .lock-locked { color: var(--lock-color); }
        .lock-unlocked { color: var(--unlock-color); }

        /* Navigation */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid var(--border);
            color: var(--accent);
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        /* Card Section */
        .card-section {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
        }

        .card-section-title {
            font-size: 11px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .game-card {
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.1) 0%, rgba(78, 204, 163, 0.1) 100%);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            transition: all 0.3s;
        }

        .game-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(233, 69, 96, 0.2);
        }

        .game-card.hidden-card {
            background: rgba(255, 255, 255, 0.03);
            border-style: dashed;
        }

        .game-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .game-card-icon {
            font-size: 18px;
        }

        .game-card-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .game-card-type {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: auto;
        }

        .game-card-type.action {
            background: rgba(233, 69, 96, 0.2);
            color: var(--accent);
        }

        .game-card-type.condition {
            background: rgba(78, 204, 163, 0.2);
            color: var(--success);
        }

        .game-card-desc {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .game-card-status {
            font-size: 10px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-used {
            color: #888;
            text-decoration: line-through;
        }

        .status-active {
            color: var(--success);
        }

        .status-hidden {
            color: var(--text-secondary);
            font-style: italic;
        }

        [data-theme="light"] .game-card {
            background: linear-gradient(135deg, rgba(214, 51, 108, 0.08) 0%, rgba(43, 138, 62, 0.08) 100%);
        }

        [data-theme="light"] .game-card.hidden-card {
            background: rgba(0, 0, 0, 0.03);
        }
        .nav-btn:hover {
            background: rgba(233, 69, 96, 0.3);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .nav-prev { left: 8px; }
        .nav-next { right: 8px; }

        .pagination {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.3s;
            cursor: pointer;
        }

        .dot.active {
            background: var(--accent);
            transform: scale(1.3);
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 6px;
            font-size: 9px;
            color: var(--text-secondary);
            background: rgba(0,0,0,0.3);
        }

        [data-theme="light"] .footer {
            background: rgba(255,255,255,0.5);
        }

        .error {
            text-align: center;
            padding: 30px;
            color: var(--accent);
            font-size: 14px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes revealFlash {
            0% { background: transparent; }
            50% { background: rgba(78, 204, 163, 0.3); }
            100% { background: transparent; }
        }

        .card-wrapper {
            animation: fadeIn 0.4s ease-out;
        }

        .stat-row.reveal-animation {
            animation: revealFlash 0.8s ease-out;
        }

        .updating {
            animation: pulse 1.5s infinite;
        }

        .swipe-hint {
            text-align: center;
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        @media (max-width: 480px) {
            .card { padding: 15px; }
            .player-name { font-size: 17px; }
            .nav-btn { width: 35px; height: 35px; font-size: 20px; }
            }
    </style>

<body>
    <div class="header">
        <h1>☢️ БУНКЕР</h1>
        <div class="subtitle">Карточки игроков</div>
        <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>

    <div class="progress-container" id="progressContainer">
        <div class="progress-label">
            <span>Раскрыто характеристик</span>
            <span id="progressText">0/0</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
    </div>

    <div class="carousel-container">
        <button class="nav-btn nav-prev" id="prevBtn">‹</button>
        <div class="carousel-track" id="track"></div>
        <button class="nav-btn nav-next" id="nextBtn">›</button>
        <div class="pagination" id="pagination"></div>
    </div>
    <div class="footer">
        Свайпай или жми стрелки для навигации
    </div>

    <script>
        const CARD_TYPE_LABELS = {
            action: "Карта действия",
            condition: "Карта условия"
        };

        const CARD_ICONS = {
            action: "🎴",
            condition: "📜"
        };

        const LABELS = {
            profession: "Профессия",
            health: "Здоровье",
            baggage: "Багаж",
            extra_info: "Доп. информация",
            character: "Характер",
            nationality: "Национальность",
            hobby: "Хобби",
            orientation: "Ориентация",
            ideology: "Идеология",
            favorite: "Избранное",
            phobia: "Фобия",
            knowledge: "Знания"
        };

        const ICONS = {
            profession: "💼",
            health: "❤️",
            baggage: "🎒",
            extra_info: "📌",
            character: "🧠",
            nationality: "🌍",
            hobby: "🎯",
            orientation: "🏳️",
            ideology: "📖",
            favorite: "⭐",
            phobia: "😨",
            knowledge: "📚"
        };

        let currentIndex = 0;
        let players = [];
        let myId = null;
        let lastDataHash = "";
        let autoUpdateInterval = null;

        // Theme
        function initTheme() {
            const tg = window.Telegram?.WebApp;
            if (tg) {
                const isDark = tg.colorScheme === 'dark';
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
                document.getElementById('themeToggle').textContent = isDark ? '🌙' : '☀️';
            }
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            document.getElementById('themeToggle').textContent = next === 'dark' ? '🌙' : '☀️';
        });

        // Base64 decode + zlib decompress (pako library or native)
        function decodeBase64(str) {
            try {
                str = str.replace(/-/g, '+').replace(/_/g, '/');
                while (str.length % 4) str += '=';
                const binary = atob(str);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                return new TextDecoder('utf-8').decode(bytes);
            } catch (e) {
                console.error("Decode error:", e);
                return null;
            }
        }

        // Zlib decompress using native CompressionStream API (modern browsers)
        async function decompressZlib(bytes) {
            try {
                const stream = new Response(bytes).body;
                const decompressed = stream.pipeThrough(new DecompressionStream('deflate'));
                const result = await new Response(decompressed).arrayBuffer();
                return new TextDecoder('utf-8').decode(result);
            } catch (e) {
                console.error("Zlib decompress failed:", e);
                return null;
            }
        }

        // Try to decompress data (handles both plain JSON and zlib-compressed)
        async function decodeData(b64) {
            try {
                // First try plain base64 JSON (backward compatibility)
                const plain = decodeBase64(b64);
                if (plain && plain.startsWith('{')) {
                    return JSON.parse(plain);
                }

                // Try zlib decompression
                const str = b64.replace(/-/g, '+').replace(/_/g, '/');
                while (str.length % 4) str += '=';
                const binary = atob(str);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

                const decompressed = await decompressZlib(bytes);
                if (decompressed) {
                    return JSON.parse(decompressed);
                }

                return null;
            } catch (e) {
                console.error("Data decode failed:", e);
                return null;
            }
        }

        // Hash for comparison
        function hashData(data) {
            return JSON.stringify(data).split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0);
        }

        // Progress Bar
        function updateProgress() {
            if (!players.length) return;
            let total = 0, revealed = 0;
            players.forEach(p => {
                Object.values(p.chars || {}).forEach(c => {
                    total++;
                    if (c.revealed) revealed++;
                });
            });
            const pct = total ? (revealed / total * 100) : 0;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressText').textContent = `${revealed}/${total}`;
        }

        // Render stat
        function renderStat(key, item, isMe, playerId) {
            const isRevealed = item.revealed;
            const label = LABELS[key] || key;
            const icon = ICONS[key] || "•";
            const value = item.value || "";
            const stateKey = `${playerId}_${key}`;

            let innerHtml;
            if (isRevealed) {
                innerHtml = `
                    <div class="stat-display">
                        <span class="lock-icon lock-unlocked">🔓</span>
                        <span class="stat-value revealed">${value}</span>
                    </div>
                `;
            } else {
                innerHtml = `
                    <div class="stat-display">
                        <span class="lock-icon lock-locked">🔒</span>
                        <span class="stat-value hidden">${isMe ? value : 'Скрыто'}</span>
                    </div>
                `;
            }

            return `
                <div class="stat-row" data-key="${stateKey}">
                    <div class="stat-icon">${icon}</div>
                    <div class="stat-content">
                        <div class="stat-label">${label}</div>
                        ${innerHtml}
                    </div>
                </div>
            `;
        }

        function renderCard(player) {
            const isMe = player.id === myId;
            const badgeClass = isMe ? 'badge-me' : 'badge-other';
            const badgeText = isMe ? '👤 ТВОЯ КАРТОЧКА' : '👥 ИГРОК';

            let statsHtml = '';
            const keys = Object.keys(player.chars || {});
            keys.forEach(key => {
                statsHtml += renderStat(key, player.chars[key], isMe, player.id);
            });

            // Render action card
            let actionCardHtml = '';
            if (player.action_card) {
                const card = player.action_card;
                const isCardRevealed = card.revealed || isMe;
                const cardClass = isCardRevealed ? 'game-card' : 'game-card hidden-card';
                const cardStatus = card.used 
                    ? '<span class="status-used">✅ Использована</span>' 
                    : (isCardRevealed ? '<span class="status-active">🟢 Активна</span>' : '<span class="status-hidden">🔒 Скрыта</span>');

                if (isCardRevealed) {
                    actionCardHtml = `
                        <div class="game-card">
                            <div class="game-card-header">
                                <span class="game-card-icon">🎴</span>
                                <span class="game-card-name">${card.name || 'Без названия'}</span>
                                <span class="game-card-type action">Карта действия</span>
                            </div>
                            <div class="game-card-desc">${card.desc || ''}</div>
                            <div class="game-card-status">${cardStatus}</div>
                        </div>
                    `;
                } else {
                    actionCardHtml = `
                        <div class="game-card hidden-card">
                            <div class="game-card-header">
                                <span class="game-card-icon">🔒</span>
                                <span class="game-card-name">Скрытая карта</span>
                                <span class="game-card-type action">Карта действия</span>
                            </div>
                            <div class="game-card-desc">Действие будет раскрыто при использовании...</div>
                            <div class="game-card-status">${cardStatus}</div>
                        </div>
                    `;
                }
            }

            // Render condition card
            let conditionCardHtml = '';
            if (player.condition_card) {
                const card = player.condition_card;
                const isCardRevealed = card.revealed || isMe;
                const cardClass = isCardRevealed ? 'game-card' : 'game-card hidden-card';
                const cardStatus = card.used 
                    ? '<span class="status-used">✅ Сработала</span>' 
                    : (isCardRevealed ? '<span class="status-active">🟢 Ожидает</span>' : '<span class="status-hidden">🔒 Скрыта</span>');

                if (isCardRevealed) {
                    conditionCardHtml = `
                        <div class="game-card">
                            <div class="game-card-header">
                                <span class="game-card-icon">📜</span>
                                <span class="game-card-name">${card.name || 'Без названия'}</span>
                                <span class="game-card-type condition">Карта условия</span>
                            </div>
                            <div class="game-card-desc">${card.desc || ''}</div>
                            <div class="game-card-status">${cardStatus}</div>
                        </div>
                    `;
                } else {
                    conditionCardHtml = `
                        <div class="game-card hidden-card">
                            <div class="game-card-header">
                                <span class="game-card-icon">🔒</span>
                                <span class="game-card-name">Скрытая карта</span>
                                <span class="game-card-type condition">Карта условия</span>
                            </div>
                            <div class="game-card-desc">Условие будет раскрыто при срабатывании...</div>
                            <div class="game-card-status">${cardStatus}</div>
                        </div>
                    `;
                }
            }

            // Combine cards section
            let cardsSection = '';
            if (actionCardHtml || conditionCardHtml) {
                cardsSection = `
                    <div class="card-section">
                        <div class="card-section-title">🃏 Карты игрока</div>
                        ${actionCardHtml}
                        ${conditionCardHtml}
                    </div>
                `;
            }

            return `
                <div class="card-wrapper">
                    <div class="card">
                        <div style="text-align: center;">
                            <span class="player-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="player-name">${player.name || 'Неизвестный'}</div>
                        ${statsHtml}
                        ${cardsSection}
                        ${isMe ? '<div class="swipe-hint">👆 Свайпай для просмотра других игроков</div>' : ''}
                    </div>
                </div>
            `;
        }

        function updateCarousel() {
            const track = document.getElementById('track');
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === players.length - 1;
            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }

        function initCarousel() {
            if (!players.length) {
                document.getElementById('track').innerHTML = '<div class="error">❌ Нет данных</div>';
                return;
            }

            const myIndex = players.findIndex(p => p.id === myId);
            if (myIndex > 0) {
                const [me] = players.splice(myIndex, 1);
                players.unshift(me);
            }

            const track = document.getElementById('track');
            track.innerHTML = players.map(p => renderCard(p)).join('');

            const pagination = document.getElementById('pagination');
            pagination.innerHTML = players.map((_, i) => 
                `<div class="dot ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`
            ).join('');

            document.querySelectorAll('.dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    currentIndex = parseInt(dot.dataset.index);
                    updateCarousel();
                });
            });

            updateProgress();
            updateCarousel();
        }

        // Navigation
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentIndex > 0) { currentIndex--; updateCarousel(); }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentIndex < players.length - 1) { currentIndex++; updateCarousel(); }
        });

        // Swipes
        let touchStartX = 0;
        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            const diff = touchStartX - e.changedTouches[0].screenX;
            if (Math.abs(diff) > 50) {
                if (diff > 0 && currentIndex < players.length - 1) { currentIndex++; updateCarousel(); }
                else if (diff < 0 && currentIndex > 0) { currentIndex--; updateCarousel(); }
            }
        }, { passive: true });

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' && currentIndex > 0) { currentIndex--; updateCarousel(); }
            if (e.key === 'ArrowRight' && currentIndex < players.length - 1) { currentIndex++; updateCarousel(); }
        });

        function startAutoUpdate() {
            // Проверяем URL на изменения данных каждые 5 секунд
            autoUpdateInterval = setInterval(() => {
                checkForUpdates();
            }, 5000);
        }

        function checkForUpdates() {
            // В реальности здесь должен быть запрос к API бота
            // Сейчас просто обновляем прогресс-бар
            updateProgress();
        }

        // Load data from URL parameter (base64 or zlib-compressed)
        async function loadData() {
            try {
                const params = new URLSearchParams(window.location.search);
                const b64 = params.get('d');

                if (!b64) {
                    document.getElementById('track').innerHTML = '<div class="error">❌ Нет данных. Откройте через бота.</div>';
                    return;
                }

                const data = await decodeData(b64);
                if (!data) {
                    document.getElementById('track').innerHTML = '<div class="error">❌ Ошибка декодирования данных. Попробуйте открыть заново.</div>';
                    return;
                }

                // Handle compact format
                if (data.m !== undefined) {
                    myId = data.m;
                    players = (data.p || []).map(p => ({
                        id: p.id,
                        name: p.nm,
                        chars: Object.fromEntries(Object.entries(p.ch || {}).map(([k, v]) => [k, {
                            value: v.v || '',
                            revealed: v.r === 1
                        }])),
                        action_card: p.ac ? {
                            type: 'action',
                            name: p.ac.n,
                            desc: p.ac.d,
                            revealed: p.ac.rv === 1,
                            used: p.ac.u === 1
                        } : null,
                        condition_card: p.cc ? {
                            type: 'condition', 
                            name: p.cc.n,
                            desc: p.cc.d,
                            revealed: p.cc.rv === 1,
                            used: p.cc.u === 1
                        } : null
                    }));
                } else {
                    // Legacy format
                    myId = data.myId || null;
                    players = data.players || [];
                }

                initCarousel();
            } catch (e) {
                document.getElementById('track').innerHTML = `<div class="error">❌ Ошибка: ${e.message}</div>`;
            }
        }

        // Init
        initTheme();
        loadData();
        startAutoUpdate();

        if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
            Telegram.WebApp.onEvent('themeChanged', initTheme);
        }
    </script>
</body>
</html>
